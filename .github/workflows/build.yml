name: Build downloads

# Runs when you publish a release, builds single-file apps, and attaches them to that release.
# You can also run it by hand from the Actions tab and type a tag like v1.0.0.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the files to (for example v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Aneemay-Windows
            file: Aneemay-Windows.exe
            sep: ";"
            extra: --windowed
          - os: ubuntu-latest
            name: Aneemay-Linux
            file: Aneemay-Linux.tar.gz
            sep: ":"
            extra: ""
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        shell: bash
        working-directory: anime-spammer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Prepare images
        run: python prepare_bundle_images.py

      - name: Build single-file app
        run: |
          python -m PyInstaller --clean --noconfirm --onefile ${{ matrix.extra }} \
            --name "${{ matrix.name }}" \
            --hidden-import PIL._tkinter_finder \
            --add-data ".bundle-images${{ matrix.sep }}images" \
            --add-data "media${{ matrix.sep }}media" \
            main.py

      - name: Pack Linux app (keeps it runnable after download)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/Aneemay-Linux
          tar -czf dist/Aneemay-Linux.tar.gz -C dist Aneemay-Linux

      - name: Remove the old raw Linux file from the release
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset "$TAG" Aneemay-Linux --yes || true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/${{ matrix.file }}" --clobber
