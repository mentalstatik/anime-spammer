name: Build downloads

# Runs when you publish a release, builds single-file apps, and attaches them to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Aneemay-Windows
            file: Aneemay-Windows.exe
            sep: ";"
            extra: --windowed
          - os: ubuntu-latest
            name: Aneemay-Linux
            file: Aneemay-Linux
            sep: ":"
            extra: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: anime-spammer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Prepare images
        run: python prepare_bundle_images.py

      - name: Build single-file app
        run: |
          python -m PyInstaller --clean --noconfirm --onefile ${{ matrix.extra }} \
            --name "${{ matrix.name }}" \
            --hidden-import PIL._tkinter_finder \
            --add-data ".bundle-images${{ matrix.sep }}images" \
            --add-data "media${{ matrix.sep }}media" \
            main.py

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/${{ matrix.file }}" --clobber
